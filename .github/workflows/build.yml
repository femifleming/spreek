name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ macOS, Windows, Linux ]
        include:
          - os: macOS
            runner: macos-latest
          - os: Windows
            runner: windows-latest
          - os: Linux
            runner: ubuntu-22.04
    name: spreek · ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libegl-dev \
            libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev ninja-build xvfb fonts-dejavu-core libcurl4-openssl-dev

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Linux" ]; then EXTRA="-G Ninja"; fi
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-G Ninja -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"; fi
          if [ "$RUNNER_OS" = "Windows" ]; then EXTRA="-A x64"; fi
          cmake -B build $EXTRA -DCMAKE_BUILD_TYPE=Release -DSPREEK_LTO=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 4 --target Spreekbuis_All SBTest SpraakTest SpraakFull SpreekTest SpreekHostCheck

      - name: Test
        shell: bash
        run: |
          find_exe() { find build -type f \( -name "$1" -o -name "$1.exe" \) -path "*_artefacts*" | head -n 1; }
          RUN=""
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; fi
          mkdir -p out
          echo "== SBTest (the word bank's layers; the built-in voice is rendered on first use)"; $RUN "$(find_exe SBTest)"
          echo "== SpraakTest"; $RUN "$(find_exe SpraakTest)" out
          echo "== SpraakFull (the speech computer)"; $RUN "$(find_exe SpraakFull)"
          echo "== SpreekTest (what joins them, old sessions, state, stereo, the play log)"; $RUN "$(find_exe SpreekTest)"
          $RUN "$(find_exe SpreekTest)" --shots out/shots
          echo "== SpreekHostCheck (the built plug-in loaded like a DAW: VST3, VST2, AU; stereo)"
          V3="$(find build -path '*Release*' -name 'Spreekbuis.vst3' | head -n 1)"
          V2="$(find build -path '*_artefacts*/VST/*' \( -name 'Spreekbuis.vst' -o -name '*Spreekbuis.dll' -o -name '*Spreekbuis*.so' \) -not -path '*/Contents/*' | head -n 1)"
          echo "VST3: $V3  VST2: $V2"; ls build/Spreekbuis_artefacts/*/VST build/Spreekbuis_artefacts/VST 2>/dev/null || true
          PLUGS=("$V3" "$V2")
          if [ "$RUNNER_OS" = "macOS" ]; then
            mkdir -p ~/Library/Audio/Plug-Ins/Components
            cp -R "$(find build -path '*Release*' -name 'Spreekbuis.component' | head -n 1)" ~/Library/Audio/Plug-Ins/Components/
            killall -9 AudioComponentRegistrar 2>/dev/null || true
            auval -v aumu Sprk Frkp | tail -n 5
            PLUGS+=(~/Library/Audio/Plug-Ins/Components/Spreekbuis.component)
          fi
          $RUN "$(find_exe SpreekHostCheck)" "${PLUGS[@]}"

      - name: Package
        shell: bash
        run: ci/package.sh "${{ matrix.os }}" build

      - uses: actions/upload-artifact@v4
        with:
          name: spreek-${{ matrix.os }}
          path: dist/spreek-${{ matrix.os }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        run: cd packages && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: spreek ${{ github.ref_name }}
          files: packages/*
          generate_release_notes: true
